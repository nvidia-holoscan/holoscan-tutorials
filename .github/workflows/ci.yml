name: Validate tutorials

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tutorials-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install -r .github/requirements.txt
      - name: Check sources and documentation
        run: python -m pre_commit run --all-files --show-diff-on-failure
